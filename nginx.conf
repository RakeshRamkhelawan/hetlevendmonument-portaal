# Template: de officiele nginx-image vult ${API_UPSTREAM} in bij het starten
# (/etc/nginx/templates/*.template -> /etc/nginx/conf.d/). Alleen variabelen die in de
# omgeving bestaan worden vervangen; nginx-variabelen als $uri blijven staan.
# Alleen bij een echt upgrade-verzoek (websocket) "upgrade" doorgeven; anders keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 5174;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads van verhalen (zelfde grens als de backend, 50 MB)
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # API via dezelfde herkomst: de browser praat alleen met dit domein (geen CORS, CSP
    # connect-src 'self'); nginx stuurt door naar de backend. In Azure Container Apps is dat
    # de interne app `levendmonument-api`, in docker compose de dienst `backend`.
    # LET OP: API_UPSTREAM zonder pad en zonder slash aan het eind (http://host:poort). Met een
    # variabele in proxy_pass vervangt een pad het HELE verzoekpad. In Azure Container Apps de
    # volledige interne naam gebruiken (<app>.internal.<omgevingsdomein>): de resolver hieronder
    # kent de zoekdomeinen uit /etc/resolv.conf niet.
    # Pas opzoeken bij een verzoek (resolver + variabele), niet bij het starten: anders weigert
    # nginx te starten zolang de backend nog niet bestaat of opstart (gemeten 2026-11-01:
    # "host not found in upstream"). NGINX_LOCAL_RESOLVERS vult de image zelf uit
    # /etc/resolv.conf (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 in de Dockerfile).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
        # De backend zet eigen (strengere of verouderde) varianten; het portaal is de ene bron.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
