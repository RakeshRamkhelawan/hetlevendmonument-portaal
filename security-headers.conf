# Beveiligingsheaders voor ELKE response van het portaal (FE-SEC-012).
#
# Waarom een apart bestand dat in elke location wordt ge-include: nginx erft `add_header`
# NIET door naar een location die zelf een `add_header` heeft. In de oude nginx.conf stonden de
# headers op server-niveau, en kregen index.html en alle statische bestanden ze daardoor niet.
#
# CSP, per bron de reden:
#   script-src  hCaptcha laadt zijn script van js.hcaptcha.com (HCaptchaWidget.tsx)
#   style-src   'unsafe-inline': MapLibre en React zetten style-attributen; hCaptcha-stijlen
#   img-src     https: in het algemeen: het logo in de portaalinstellingen is een vrij https-adres;
#               afbeeldingen kunnen geen code uitvoeren. Plus data:/blob: van MapLibre.
#   media-src   audio/video uit Azure Blob
#   connect-src eigen API (zelfde herkomst via /api/), kaarttegels, hCaptcha
#   frame-src   het hCaptcha-venster
#   worker-src  de MapLibre-worker (eigen herkomst, blob: als terugval)
#   form-action Stripe Checkout voor donaties
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.blob.core.windows.net; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://hcaptcha.com https://*.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Oude browserfilter uitgezet: hij veroorzaakt zelf lekken; CSP neemt het werk over.
add_header X-XSS-Protection "0" always;
